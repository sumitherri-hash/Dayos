<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DAYOS — AI Operating System</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <header>
      <h1>DAYOS</h1>
      <p>AI Operating System</p>
    </header>

    <section id="aiCore">

      <div>
        CORE STATUS:
        <span id="coreState">IDLE</span>
      </div>

    </section>

    <section id="workspace">

      <div id="output">
        DAYOS AI is ready.
      </div>

      <div id="taskList"></div>

      <div id="inputArea">

        <input
          id="userInput"
          type="text"
          placeholder="Tell DAYOS what you want to do..."
          autocomplete="off"
        >

        <button id="sendButton" onclick="handleUserInput()">
          Send
        </button>

      </div>

    </section>

  </main>

  <!-- DAYOS AI CORE -->
  <script src="AI.js"></script>

  <!-- DAYOS APP CONTROLLER -->
  <script src="app.js"></script>

</body>
</html>
